apiVersion: v1
kind: ConfigMap
metadata:
  name: log-output-config
  namespace: log-pong
data:
  MESSAGE: "hello world"
  information.txt: |
    this text is from file
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-app
  namespace: log-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output-app
  template:
    metadata:
      labels:
        app: log-output-app
    spec:
      containers:
        - name: log-writer-app
          image: zanaad/log-writer-app:9eae1e6ae9bf6930c47afe12e4b64e74f1cb4af8
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
        - name: log-reader-app
          image: zanaad/log-reader-app:9eae1e6ae9bf6930c47afe12e4b64e74f1cb4af8
          ports:
            - containerPort: 3000
          # No readiness probe here: the reader's /readyz calls Ping-pong, and
          # checking it every few seconds would keep Ping-pong from scaling to zero.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: PORT
              value: "3000"
            # Fully qualified name of the Knative Service, as the exercise tips recommend
            - name: PING_PONG_SERVICE
              value: http://ping-pong-app.log-pong.svc.cluster.local
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          volumeMounts:
            - name: config-volume
              mountPath: /config
      volumes:
        - name: config-volume
          configMap:
            name: log-output-config
            items:
              - key: information.txt
                path: information.txt
---
# NodePort 30080 is mapped to localhost:8082 by the k3d cluster
# (--port 8082:30080@agent:0)
apiVersion: v1
kind: Service
metadata:
  name: log-output-app-svc
  namespace: log-pong
spec:
  type: NodePort
  selector:
    app: log-output-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
