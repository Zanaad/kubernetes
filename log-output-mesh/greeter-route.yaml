# Traffic split for calls to greeter-svc: 75% to v1, 25% to v2.
# Enforced by the waypoint proxy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: greeter-route
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: greeter-svc
    port: 3000
  rules:
  - backendRefs:
    - name: greeter-svc-1
      port: 3000
      weight: 75
    - name: greeter-svc-2
      port: 3000
      weight: 25
