# Knative getting started: Traffic splitting, step 1
# Changing the environment variable creates a new revision (hello-00002),
# which by default gets 100% of the traffic.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello
spec:
  template:
    spec:
      containers:
        - image: ghcr.io/knative/helloworld-go:latest
          ports:
            - containerPort: 8080
          env:
            - name: TARGET
              value: "Knative"
