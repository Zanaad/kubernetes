# Knative getting started: Traffic splitting, step 2
# 50% of requests go to the latest revision ("Hello Knative!")
# and 50% to the first revision hello-00001 ("Hello World!").
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello
spec:
  template:
    spec:
      containers:
        - image: ghcr.io/knative/helloworld-go:latest
          ports:
            - containerPort: 8080
          env:
            - name: TARGET
              value: "Knative"
  traffic:
    - latestRevision: true
      percent: 50
    - revisionName: hello-00001
      percent: 50
